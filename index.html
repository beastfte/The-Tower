<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Tower</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0a0c;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        min-height: 100vh;
      }
      /* 002 FR-021/FR-022: give Phaser's Scale.FIT mode a viewport-sized parent to scale
         the fixed-resolution canvas into — without this, FIT has nothing to grow into and
         the canvas stays pinned at its small native size (research.md #9). */
      #game-root {
        width: 100vw;
        height: 100vh;
      }
      #game-root canvas {
        image-rendering: pixelated;
        /* 014 FR-011: canvas defaults to display:inline, which reserves baseline/descender
           whitespace below it (a few px) inside #game-root's block layout — enough on its
           own, with no min bound left to mask it, to overflow the page and add a scroll
           bar at a tight viewport. */
        display: block;
      }
      /* specs/bugs/ui-text-dom-overlay: UI text lives here, not in the canvas, so it isn't
         subject to the canvas's `image-rendering: pixelated` nearest-neighbor magnification.
         Positioned/sized in JS (src/game/ui/domOverlay.ts) to track the canvas's live bounding
         box; `pointer-events: none` here lets clicks/wheel pass through to the canvas by
         default, re-enabled per element for anything actually interactive. */
      #ui-root {
        position: fixed;
        pointer-events: none;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
        z-index: 1;
      }
      #ui-root * {
        box-sizing: border-box;
      }
      .ui-text {
        position: absolute;
        white-space: pre-wrap;
        line-height: 1.35;
        margin: 0;
      }
      .ui-menu-option {
        position: absolute;
        pointer-events: auto;
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        font-family: inherit;
        white-space: pre;
      }
      .ui-menu-option:disabled {
        color: #5a5a5a;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
